version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /workers/visitors
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      worker-deps:
        patterns: ["*"]
