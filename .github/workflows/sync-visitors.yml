# MAINTAINER NOTE: Before editing, verify:
# - Script paths match actual CLI location (cli/jardin.ts)
# - Env var names match what the code expects (check cli/commands/visitors/api.ts)
# - Secrets exist in repo settings

name: Sync Visitors

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync approved messages
        env:
          PUBLIC_VISITORS_WORKER_URL: ${{ secrets.VISITORS_WORKER_URL }}
          VISITORS_ADMIN_TOKEN: ${{ secrets.VISITORS_ADMIN_TOKEN }}
        run: npx tsx cli/jardin.ts visitors sync

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/visitors/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/visitors/
          git commit -m "chore: sync visitor messages"
          git push
