name: CI
on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_VISITORS_WORKER_URL: https://visitors.9scorp4.workers.dev

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/visitors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/visitors/package-lock.json
      - run: npm ci
      - run: npm run typecheck
