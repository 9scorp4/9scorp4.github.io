<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" shape-rendering="crispEdges">
  <rect width="80" height="80" fill="#e8d9af"/>
  <!-- Pixelated target/bullseye: obsessive focus -->
  <!-- Outer ring -->
  <rect x="8" y="8" width="64" height="64" fill="none" stroke="#2d5a3d" stroke-width="4"/>
  <!-- Middle ring -->
  <rect x="20" y="20" width="40" height="40" fill="none" stroke="#2d5a3d" stroke-width="4"/>
  <!-- Inner ring -->
  <rect x="32" y="32" width="16" height="16" fill="none" stroke="#2d5a3d" stroke-width="4"/>
  <!-- Center dot -->
  <rect x="38" y="38" width="4" height="4" fill="#2d5a3d"/>
</svg>
