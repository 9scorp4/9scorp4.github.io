name = "visitors"
main = "src/index.ts"
compatibility_date = "2024-01-01"

kv_namespaces = [
  { binding = "VISITORS_KV", id = "375e72cebf7b42058651be6d0f20b395", preview_id = "82326b661b764152acbd025de14b159f" }
]

[[analytics_engine_datasets]]
binding = "GARDEN_ANALYTICS"
dataset = "garden_metrics"

# Cron triggers for daily poem generation (DST workaround: run twice)
[triggers]
crons = ["5 4 * * *", "5 5 * * *"]

# Secrets (set via wrangler secret put):
# - ADMIN_TOKEN
# - RESEND_API_KEY
# - OWNER_EMAIL
# - GROQ_API_KEY
