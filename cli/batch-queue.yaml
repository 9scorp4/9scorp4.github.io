# yaml-language-server: $schema=./batch-queue.schema.json
# Batch queue for Instagram content generation
#
# Entry types:
#   - Journal entry: slug + quotes[] (status card auto-matched by articuloNuevo)
#   - Status-only: ahoraDate (for ahora dispatches without a journal entry)
#
# Workflow:
#   1. Write journal entry in src/content/journal/{slug}/
#   2. Write ahora dispatch with articuloNuevo linking to the entry
#   3. Add entry here with quotes
#   4. Run: jardin insta batch --last=1

entries:
  # Full batch: lo que corrige el mapa
  - slug: lo-que-corrige-el-mapa
    quotes:
      - "A system that loses contact with its environment doesn't learn, it confabulates."
      - "The map needs the territory."
      - "Without it, the map starts to refer only to itself, and what looks like coherence is actually escalation — the system becomes more confident in claims that have no anchor."

  # Full batch: al borde del fenomeno
  - slug: al-borde-del-fenomeno
    quotes:
      - "Cognitive sovereignty isn't a defensive capacity. It's not about discerning truth from lies in a flood of plausible content."
      - "Cognitive sovereignty is the capacity to produce knowledge at the edge of phenomena — to be one of the nodes where new distinctions get drawn — with the conditions of negotiation preserved."
      - "It is collective. It is configural. And it is not a property of any individual."

  # Status-only: ahora dispatch 2026-05-05 (no journal entry)
  - ahoraDate: 2026-05-05

  # Full batch: smash-laterally triptych
  - slug: smash-laterally-i
    quotes:
      - "He didn't find a smarter move in the French game. He played a different game and made the French game irrelevant."
      - "The lateral move did not eliminate cost. It relocated cost."
      - "You can choose what to spend, but you cannot choose to spend nothing."

  - slug: smash-laterally-ii
    quotes:
      - "The contest does not enforce them. The body, and time, enforce them later."
      - "The lateral move is downstream of the kind of person who can make it."
      - "The receipt is in a currency the contest didn't print."

  - slug: smash-laterally-iii
    quotes:
      - "When everyone is lateral, the observer position dissolves. There is nowhere from which to keep score."
      - "The structure has stopped doing the moral work. It never was doing it."
      - "The territory has eaten the map."

  # Full batch: lo que vestía el poema
  - slug: lo-que-vestia-el-poema
    quotes:
      - "The frame doesn't suspend reality. It rearranges what counts as reality at this scale of communication."
      - "The writer who learns to dismiss every poem as the function-under-the-poem will never again use the form to find out what he is feeling."
      - "The form survives by being challenged. By being read by something that is not it."
    metalogue:
      - speaker: "RENATA"
        line: "La figura te extraña. La que está afuera de la página, no sé."
      - speaker: "YO"
        line: "Eso es cruel."
      - speaker: "RENATA"
        line: "No. Es la forma. Tú me trajiste acá precisamente porque la otra no te iba a contestar."

  # Full batch: una palabra, varias aguas
  - slug: una-palabra-varias-aguas
    quotes:
      - "The cartographer is at the level where the configuration is the object. The navigator is at the level where the configuration is the medium."
      - "The edge has epistemic privilege. The navigator at the edge has a finer practical knowledge because nothing about staying alive at the edge permits coarseness."
      - "Multipolarity is two phenomena pretending to be one."
    metalogue:
      - speaker: "NAVEGANTE"
        line: "From the water there is no *multipolaridad*. There is — más viento de este lado este año."
      - speaker: "I"
        line: "That isn't more room."
      - speaker: "NAVEGANTE"
        line: "*Cuesta más cruzar.*"

  # Full batch: lo que no necesita el nombre
  - slug: lo-que-no-necesita-el-nombre
    quotes:
      - "Science is a specific kind of relationship to error. It is an activity defined by maintaining a working corrective channel."
      - "The alfarera doesn't need the club. The club needs them."
      - "You cannot update one level without the other and call it learning. You have rearranged the furniture in the room you were trying to leave."
    metalogue:
      - speaker: "ALFARERA"
        line: "Estabas a punto de decirme que lo que llevo treinta mil años haciendo finalmente puede entrar en una categoría que existe hace trescientos."
      - speaker: "I"
        line: "I'm trying to expand the category."
      - speaker: "ALFARERA"
        line: "La inclusión la define el que incluye. La estructura no cambia."
